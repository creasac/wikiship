name: Build and attest release assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check release version
        run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"

      - name: Build plugin
        run: npm run build

      - name: Stage release assets
        run: |
          mkdir release
          cp obsidian-plugin/main.js obsidian-plugin/manifest.json obsidian-plugin/styles.css release/

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes release/main.js release/manifest.json release/styles.css

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            release/main.js
            release/styles.css
